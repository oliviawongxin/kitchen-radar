name: radar

on:
  schedule:
    - cron: '*/10 * * * *'   # backup only: GitHub runs this irregularly. Apps Script starts the job every 10 min
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false   # queue overlapping runs instead of cancelling (avoids false failure emails)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BoM radar
        run: bash fetch.sh
        env:
          RADAR_ID: IDR023
          BOM_EMAIL: wongxin@gmail.com
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true   # GitHub sometimes glitches here; retry once below
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
