name: keepalive

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > last-keepalive.txt
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add last-keepalive.txt
          git commit -m "keepalive" || exit 0
          git push
